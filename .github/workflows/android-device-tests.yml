name: Android device tests (emulator)

# Runs the instrumented tests on a real Android emulator (API 34, x86_64, KVM-accelerated) so the production
# path (ViewModel -> offline TTS engine -> ONNX Runtime Android natives -> WAV -> MediaPlayer, and the
# Perchance WebView bridge) is exercised on actual Android, not just on the Linux JVM. The verdict and the
# device logs are also published as a check run named "android-device-report".
#
# NOTE: an emulator is not a physical phone. It cannot show OEM memory killers, thermal throttling or the
# real network a user is on. See docs/offline-tts-and-perchance.md.

on:
  push:
    branches: [ 'arena/**' ]
  workflow_dispatch:
    inputs:
      test_class:
        description: 'Instrumentation class filter (empty = all)'
        required: false
        default: ''

permissions:
  contents: read
  checks: write

jobs:
  emulator:
    name: Emulator (API ${{ matrix.api }}, ${{ matrix.ram }} MB)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            ram: 4096
    env:
      GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "NO /dev/kvm"

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Environment File (.env)
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Setup Debug Keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug + androidTest APKs
        run: gradle assembleDebug assembleDebugAndroidTest --no-configuration-cache --console=plain

      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: ${{ matrix.ram }}M
          heap-size: 576M
          disk-size: 10G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/ci/run_device_tests.sh "${{ github.event.inputs.test_class }}"

      - name: Summarize
        if: always()
        run: python3 scripts/ci/summarize_device_run.py

      - name: Publish report (check run)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERDICT="$(cat build-reports/device/verdict.txt 2>/dev/null || echo 'FAIL no-results')"
          CONC=failure; case "$VERDICT" in PASS*) CONC=success;; esac
          python3 scripts/ci/publish_check_run.py "android-device-report" "$CONC" "$VERDICT (API ${{ matrix.api }}, ${{ matrix.ram }} MB)" build-reports/device/summary.md build-reports/device/details.md

      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-reports-api${{ matrix.api }}-${{ matrix.ram }}-${{ github.sha }}
          path: |
            build-reports/device/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
