name: arena-ci-diagnostics

# TEMPORARY: mirrors the steps of main.yml (unit tests + assembleDebug) on session branches and
# publishes compile errors / test results as a check-run summary so they can be read through the
# GitHub API (build logs are not downloadable from the authoring sandbox). Removed before hand-off.

on:
  push:
    branches: [ 'arena/**' ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Diagnostics build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Environment File (.env)
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Setup Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Download real voice pack (pinned revision, verified)
        continue-on-error: true
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/realpack"
          mkdir -p "$DIR"
          REV=b5afd4e991e3bdd6195528de650e2ed219d47506
          BASE="https://huggingface.co/MatiasLin/sherpa-onnx-vits-rasa-13/resolve/$REV"
          curl -fsSL --retry 3 -o "$DIR/model.onnx" "$BASE/model.onnx"
          curl -fsSL --retry 3 -o "$DIR/tokens.txt" "$BASE/tokens.txt"
          echo "4473f8d0b6f738196c1626bbf337cda99b34749b638bb7234c4cb8e1992bf804  $DIR/model.onnx" | sha256sum -c -
          test "$(stat -c %s "$DIR/model.onnx")" = 123338635
          test "$(stat -c %s "$DIR/tokens.txt")" = 9556
          echo "tokens.txt sha256: $(sha256sum "$DIR/tokens.txt" | cut -d' ' -f1)"
          echo "ORKI_REAL_VOICE_PACK_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace --no-configuration-cache --console=plain 2>&1 | tee build_tests.log

      - name: Build Debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-configuration-cache --console=plain 2>&1 | tee build_assemble.log

      - name: Publish diagnostics (check-run summary)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess
          import xml.etree.ElementTree as ET

          def read(path):
              try:
                  with open(path, errors="replace") as fh:
                      return fh.read()
              except OSError:
                  return ""

          interesting = []
          for label, path in (("tests", "build_tests.log"), ("assemble", "build_assemble.log")):
              for line in read(path).splitlines():
                  s = line.strip()
                  if (s.startswith("e: ") or s.startswith("w: file://") and "Perchance" in s
                          or s.startswith("FAILURE:") or s.startswith("* What went wrong")
                          or "error:" in s and "Task" not in s or s.startswith("Execution failed")
                          or s.startswith("BUILD ")):
                      interesting.append(f"[{label}] {s}")
          # Keep the line after "What went wrong" because it carries the actual reason.
          lines = read("build_tests.log").splitlines() + read("build_assemble.log").splitlines()
          for i, line in enumerate(lines):
              if line.strip().startswith("* What went wrong"):
                  interesting.extend("    " + l for l in lines[i + 1:i + 8])

          total = failed = skipped = 0
          per_class = []
          problems = []
          skipped_cases = []
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              root = ET.parse(f).getroot()
              t, fl, er, sk = (int(root.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              total += t; failed += fl + er; skipped += sk
              per_class.append(f"{root.get('name')}: tests={t} failures={fl + er} skipped={sk} time={root.get('time')}s")
              for tc in root.iter("testcase"):
                  for kind in ("failure", "error"):
                      for e in tc.findall(kind):
                          problems.append(f"{tc.get('classname')}.{tc.get('name')}: {(e.get('message') or '')[:700]}\n{(e.text or '')[:1800]}")
                  if tc.find("skipped") is not None:
                      skipped_cases.append(f"{tc.get('classname')}.{tc.get('name')}")

          real_lines = []
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*RealVoicePackSmokeTest*.xml")):
              root = ET.parse(f).getroot()
              for so in root.iter("system-out"):
                  real_lines.extend(l for l in (so.text or "").splitlines() if l.startswith("[real]"))

          tests_outcome = os.environ.get("TESTS_OUTCOME", "?")
          asm_outcome = os.environ.get("ASSEMBLE_OUTCOME", "?")
          ok = tests_outcome == "success" and asm_outcome == "success"
          summary = (
              f"unit tests step: **{tests_outcome}**; assembleDebug step: **{asm_outcome}**\n\n"
              f"test cases: {total}, failed: {failed}, skipped: {skipped}\n\n"
              + "\n".join(f"- {c}" for c in per_class[:60])
          )
          text = "## Compile/build diagnostics\n```\n" + "\n".join(interesting[:120]) + "\n```\n"
          text += "\n## Failing tests\n```\n" + "\n\n".join(problems[:15]) + "\n```\n"
          text += "\n## Skipped tests\n```\n" + "\n".join(skipped_cases[:40]) + "\n```\n"
          text += "\n## Real voice pack smoke test output\n```\n" + "\n".join(real_lines[:140]) + "\n```\n"
          payload = {
              "name": "arena-ci-report",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "success" if ok else "failure",
              "output": {
                  "title": f"tests={tests_outcome} assemble={asm_outcome} cases={total} failed={failed} skipped={skipped}",
                  "summary": summary[:60000],
                  "text": text[:64000],
              },
          }
          with open("payload.json", "w") as fh:
              json.dump(payload, fh)
          subprocess.run(
              ["gh", "api", "-X", "POST", f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs", "--input", "payload.json"],
              check=False, stdout=subprocess.DEVNULL,
          )
          PY

      - name: Fail job if build failed
        if: steps.tests.outcome != 'success' || steps.assemble.outcome != 'success'
        run: exit 1

  live-probe:
    name: Live Perchance probe (experiment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Network facts from a neutral vantage point
        continue-on-error: true
        run: |
          {
            for h in perchance.org null.perchance.org image-generation.perchance.org user.uploads.dev image.pollinations.ai orki-img-gen.devmightwin.workers.dev; do
              echo "== $h"
              getent hosts "$h" | head -2 || echo "NO DNS"
              curl -sS -o /dev/null -I --max-time 20 -w "http=%{http_code} ip=%{remote_ip} dns=%{time_namelookup}s tcp=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s ssl_verify=%{ssl_verify_result}\n" "https://$h/" || echo "curl failed rc=$?"
            done
            echo "== response headers of the Image API page (HEAD, no generation)"
            curl -sS -I --max-time 20 "https://perchance.org/perchance-ai-api" | grep -i -E "^(HTTP|server|cf-mitigated|cf-ray|content-type|x-frame-options|content-security-policy|location)" || true
            echo "== Pollinations: the exact request shape ImageGenerationService uses (no credentials)"
            for model in flux turbo; do
              curl -sS -o "poll_$model.bin" --max-time 90 -w "model=$model http=%{http_code} type=%{content_type} bytes=%{size_download} total=%{time_total}s\n" "https://image.pollinations.ai/prompt/a%20red%20apple?width=512&height=512&nologo=true&model=$model&seed=7" || echo "curl failed rc=$?"
              printf "magic=%s\n" "$(head -c 4 "poll_$model.bin" | xxd -p)"
            done
            echo "== Cloudflare worker without credentials (expects 401, i.e. alive but protected)"
            curl -sS -o /dev/null --max-time 20 -w "http=%{http_code}\n" -X POST -H "Content-Type: application/json" -d '{"prompt":"x"}' "https://orki-img-gen.devmightwin.workers.dev" || echo "curl failed rc=$?"
            echo "== null.perchance.org stock generator (HEAD)"
            curl -sS -I --max-time 20 "https://null.perchance.org/ai-text-to-image-generator" | grep -i -E "^(HTTP|server|cf-mitigated|location|x-frame-options|content-security-policy)" || true
          } 2>&1 | tee net_facts.log

      - name: Run the real host page in headless Chromium against live Perchance
        continue-on-error: true
        env:
          HOST_HTML: ${{ github.workspace }}/app/src/main/assets/perchance_host.html
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > probe.js <<'JSEOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const html = fs.readFileSync(process.env.HOST_HTML, 'utf8');
          const log = (...a) => console.log([new Date().toISOString().slice(11, 23), ...a].join(' '));
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          (async () => {
            const browser = await chromium.launch({ args: ['--disable-blink-features=AutomationControlled'] });
            const ctx = await browser.newContext({ viewport: { width: 400, height: 800 } });
            const page = await ctx.newPage();
            log('browser', browser.version(), 'ua', await page.evaluate(() => navigator.userAgent));
            page.on('console', m => { if (['error', 'warning'].includes(m.type())) log('console.' + m.type(), m.text().slice(0, 160)); });
            page.on('requestfailed', r => log('requestfailed', r.url().split('?')[0], r.failure() && r.failure().errorText));
            page.on('response', r => { if (r.status() >= 400) { const h = r.headers(); log('http', r.status(), r.url().split('?')[0], 'server=' + (h.server || ''), 'cf-mitigated=' + (h['cf-mitigated'] || '')); } });
            await page.addInitScript(() => {
              window.__calls = [];
              window.AndroidBridge = {
                onEvent: (id, stage, detail) => window.__calls.push(['event', id, stage, detail]),
                onWarmUpDone: (ok, why, ms) => window.__calls.push(['warm', ok, why, ms]),
                onImageResult: (id, url, dataUrl, seed) => window.__calls.push(['result', id, url, dataUrl ? ('dataUrl:' + dataUrl.length) : '', seed]),
                onImageError: (id, code, msg) => window.__calls.push(['error', id, code, msg]),
              };
            });
            await page.route('https://perchance.org/__orki_host__', route => route.fulfill({ status: 200, contentType: 'text/html; charset=utf-8', body: html }));
            await page.goto('https://perchance.org/__orki_host__');
            let drained = 0;
            const drain = async () => { const calls = await page.evaluate(() => window.__calls); for (; drained < calls.length; drained++) log('bridge', JSON.stringify(calls[drained]).slice(0, 300)); return calls; };
            await page.evaluate(() => window.orkiWarmUp(15000));
            const t0 = Date.now();
            while (Date.now() - t0 < 25000) { const c = await drain(); if (c.some(x => x[0] === 'warm')) break; await sleep(500); }
            const id = 'live-' + Date.now();
            await page.evaluate((rid) => window.orkiGenerate(rid, 'a red apple on a wooden table, simple illustration', '768x768', 0, 120000), id);
            const t1 = Date.now();
            let lastFrames = '';
            while (Date.now() - t1 < 130000) {
              const c = await drain();
              if (c.some(x => (x[0] === 'result' || x[0] === 'error') && x[1] === id)) break;
              const frames = page.frames().map(f => f.url().split('?')[0]).join(' | ');
              if (frames !== lastFrames) { lastFrames = frames; log('frames', frames); }
              await sleep(1000);
            }
            const calls = await drain();
            const final = calls.find(x => (x[0] === 'result' || x[0] === 'error') && x[1] === id);
            log('FINAL', JSON.stringify(final || 'NO ANSWER within 130s'), 'elapsed_ms', Date.now() - t1);
            log('frames at end', page.frames().map(f => f.url().split('?')[0]).join(' | '));
            if (final && final[0] === 'result' && final[2]) {
              const resp = await fetch(final[2], { headers: { Referer: 'https://perchance.org/' } });
              const buf = Buffer.from(await resp.arrayBuffer());
              log('download', resp.status, resp.headers.get('content-type'), buf.length + ' bytes', 'magic=' + buf.subarray(0, 4).toString('hex'));
            }
            await browser.close();
          })().catch(e => { log('probe crashed', String(e)); process.exit(0); });
          JSEOF
          sed -i 's/^          //' probe.js
          timeout 200 node probe.js 2>&1 | tee "$GITHUB_WORKSPACE/live_probe.log" || true

      - name: Publish live probe (check-run summary)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          def read(p):
              try:
                  return open(p, errors="replace").read()
              except OSError:
                  return "(missing)"
          net = read("net_facts.log")
          live = read("live_probe.log")
          final = [l for l in live.splitlines() if " FINAL " in l or "download" in l]
          payload = {
              "name": "arena-live-probe",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {
                  "title": (final[0][:120] if final else "no FINAL line"),
                  "summary": "\n".join(final)[:4000] or "no result",
                  "text": ("## Network facts\n```\n" + net[:20000] + "\n```\n## Headless browser run\n```\n" + live[:40000] + "\n```")[:64000],
              },
          }
          json.dump(payload, open("live_payload.json", "w"))
          subprocess.run(["gh", "api", "-X", "POST", f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs", "--input", "live_payload.json"], check=False, stdout=subprocess.DEVNULL)
          PY
